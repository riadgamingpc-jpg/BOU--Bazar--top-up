<!DOCTYPE html>
<html>
<head>
<title>BOU BAZAR TOP UP</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
font-family: Arial;
background:#111;
color:white;
text-align:center;
}

h1{
color:#00ffd5;
}

.package{
background:#222;
margin:10px;
padding:15px;
border-radius:10px;
}

button{
background:#00ffd5;
border:none;
padding:10px 20px;
border-radius:5px;
margin:5px;
font-size:16px;
}

.admin{
background:#000;
padding:15px;
margin:20px;
border-radius:10px;
}
</style>
</head>

<body>

<h1>BOU BAZAR TOP UP</h1>

<div class="package">
<h3>25 Diamond 💎</h3>
<p>22 TK</p>
<button onclick="order('25 Diamond')">Select</button>
</div>

<div class="package">
<h3>100 Diamond 💎</h3>
<p>80 TK</p>
<button onclick="order('100 Diamond')">Select</button>
</div>

<div class="package">
<h3>310 Diamond 💎</h3>
<p>310 TK</p>
<button onclick="order('310 Diamond')">Select</button>
</div>

<div class="package">
<h3>Weekly Pass</h3>
<p>150 TK</p>
<button onclick="order('Weekly Pass')">Select</button>
</div>

<div class="package">
<h3>Level Up Pass</h3>
<p>420 TK</p>
<button onclick="order('Level Up Pass')">Select</button>
</div>

<div class="package">
<h3>Evo Gun</h3>
<p>69 TK</p>
<button onclick="order('Evo Gun')">Select</button>
</div>

<div class="package" id="ucllight">
<h3>UCL Light</h3>
<p>1 TK</p>
<button onclick="order('UCL Light')">Select</button>
</div>

<div class="package" id="ucl">
<h3>UCL</h3>
<p>10 TK</p>
<button onclick="order('UCL')">Select</button>
</div>

<div class="package" id="matli">
<h3>Matli</h3>
<p>660 TK</p>
<button onclick="order('Matli')">Select</button>
</div>

<div class="admin">
<h2>Offer Control</h2>

<button onclick="toggle('ucllight')">UCL Light ON/OFF</button>
<button onclick="toggle('ucl')">UCL ON/OFF</button>
<button onclick="toggle('matli')">Matli ON/OFF</button>

</div>

<div class="admin">
<h2>Payment</h2>
<p>bKash / Nagad: 01851634841</p>
<p>WhatsApp Order: 01624997988</p>
</div>

<script>

function order(item){
var uid = prompt("Enter Your Player ID:");

if(uid){
var message = "Order: " + item + "%0APlayer ID: " + uid;
window.open("https://wa.me/8801624997988?text=" + message);
}

}

function toggle(id){

var x = document.getElementById(id);

if(x.style.display === "none"){
x.style.display = "block";
}else{
x.style.display = "none";
}

}

</script>

</body>
</html>
